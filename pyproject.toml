[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "octreg"
dynamic = ["version"]
description = "Registration of serial-sectioning OCT: the slabs of a block to each other (tilestack) and the block to an ex-vivo MRI (octreg)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Yuntian Yang" }]
dependencies = ["torch>=1.11", "numpy>=1.20", "scipy>=1.6", "scikit-image>=0.19", "nibabel>=3.2", "tifffile>=2021.1", "matplotlib",
                "pillow"]

[project.optional-dependencies]
test = ["pytest", "SimpleITK"]
tilestack = ["h5py"]

[project.urls]
Homepage = "https://github.com/yyttim/oct-mri-registration"
Repository = "https://github.com/yyttim/oct-mri-registration"

[project.scripts]
octreg = "octreg.cli:main"

[tool.setuptools]
packages = ["octreg", "tilestack"]

[tool.setuptools.dynamic]
version = { attr = "octreg.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
